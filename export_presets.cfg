; Two Windows playtest presets. embed_pck stays false so the zip ships the exe and a sibling .pck.
; Testing / Experimental: custom feature manaforge_debug, debug tools kept in the pack.
; Release / Stable: custom feature manaforge_stable, debug tools stripped.
; Export (from the project root, Godot 4.7.2):
;   godot --headless --path . --export-release "Windows Testing / Experimental" builds/experimental/TalesOfTheManaforge.exe
;   godot --headless --path . --export-release "Windows Release / Stable" builds/stable/TalesOfTheManaforge.exe
; Zip the exe and the .pck beside it. Do not flip embed_pck on for those zips.

[preset.0]

name="Windows Testing / Experimental"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features="manaforge_debug"
export_filter="all_resources"
include_filter=""
exclude_filter="*.md,*.py,docs/*,Assets upload/*,assets/art/_archive/*,assets/library/*,assets/refs/*,tools/scene_sanity.gd,tools/bake_hub_layout.gd,tools/legacy/*,scripts/verify_headless.gd,scripts/pass_f_playthrough.gd,scripts/polish_smoke.gd,scripts/playtest_ship.gd,scripts/playtest_quit.gd,scripts/capture_art_ship.gd,scripts/capture_clearing.gd,scripts/capture_hub.gd,scripts/capture_echo.gd,scripts/capture_keeper_anims.gd,scripts/capture_elaia.gd,scripts/capture_debug_panel.gd,assets/art/MANIFEST.json,assets/art/forge/forge_meta.json,assets/art/forge/markers.json,assets/art/hub/hub_deco_meta.json,assets/art/hub/hub_deco_sized_meta.json,assets/art/keeper/keeper_meta.json,assets/art/props/props_meta.json,assets/art/props/harvest_nodes_meta.json,assets/art/tiles/tiles_meta.json,assets/art/ui/ascension_shop_layout_meta.json,assets/art/ui/manatree_care_panel_meta.json,assets/art/wisps/wisp_meta.json,assets/audio/MANIFEST.json"
export_path="builds/experimental/TalesOfTheManaforge.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=false
texture_format/bptc=true
texture_format/s3tc=true
texture_format/etc=false
texture_format/etc2=false
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=true
application/icon=""
application/file_version="0.1.1.0"
application/product_version="0.1.1.0"
application/company_name="HaexFlex"
application/product_name="Tales of the Manaforge"
application/file_description="Tales of the Manaforge — Experimental"
application/copyright=""
application/trademarks=""
ssh_remote_deploy/enabled=false

